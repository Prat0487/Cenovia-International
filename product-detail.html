<!DOCTYPE html>
<html lang="en">
<head>
    <header-tags></header-tags>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://cenoviainternational.com/product-detail.html">
    <meta name="description" content="Explore the product details of Cenovia International. Premium sportswear manufacturing and export.">
    <title>Product Detail - Cenovia International</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/custom.css" rel="stylesheet">
    <link href="css/ui-theme.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script type="module" src="js/ui-kit.js"></script>
    <script src="components/TopRibbon.js"></script>
    <script src="components/MainNav.js"></script>
    <script src="components/SiteFooter.js"></script>
</head>
<body class="flex flex-col min-h-screen">
    <top-ribbon></top-ribbon>
    <main-nav></main-nav>
    <main class="flex-grow">
        <div class="container mx-auto px-4 py-8">
            <nav id="productBreadcrumb" class="ui-breadcrumb mb-6 text-sm text-[hsl(var(--muted-foreground))] flex items-center gap-2 flex-wrap"></nav>
            <div class="flex flex-col md:flex-row gap-8">
                <div class="md:w-3/5 flex-grow ui-card overflow-hidden">
                    <img id="productImage" src="" alt="" class="w-full h-auto object-contain">
                </div>
                <div class="md:w-2/5">
                    <h2 id="productName" class="text-3xl font-bold mb-4"></h2>
                    <div id="productAttributes" class="text-[hsl(var(--muted-foreground))]">
                    </div>
                    <div class="mt-6 flex flex-wrap gap-3">
                        <a id="productInquiryLink" href="contact-us.html" class="ui-btn-success">
                            Enquire Now
                        </a>
                        <button id="productSaveButton" type="button" class="ui-btn-outline wishlist-btn w-auto px-4" aria-pressed="false">
                            <i data-lucide="heart"></i>
                            <span>Save to shortlist</span>
                        </button>
                    </div>
                </div>
            </div>

            <section id="similarProducts" class="mt-16 hidden">
                <h2 class="text-2xl font-bold mb-6">Similar Products</h2>
                <div id="similarProductsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </section>

            <section id="recentlyViewed" class="mt-16 hidden">
                <h2 class="text-2xl font-bold mb-6">Recently Viewed</h2>
                <div id="recentlyViewedGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </section>
        </div>
    </main>
    <site-footer></site-footer>
    <script src="js/buyer-utils.js"></script>
    <script src="js/product-loader.js"></script>
    <script src="js/global-search.js"></script>
    <script src="js/product-detail.js"></script>
    <script src="js/buyer-bar.js"></script>
</body>
</html>
