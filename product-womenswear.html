<!DOCTYPE html>
<html lang="en">
<head>
  <header-tags></header-tags>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://cenoviainternational.com/product-womenswear.html">
  <meta name="description" content="Premium women's sportswear manufacturing and export. Specialized in sports bras, athletic tops, and performance wear for international markets.">
  <meta name="keywords" content="women's sportswear manufacturer, premium sports bra supplier, wholesale athletic tops, custom sportswear export">
  <title>Women's Premium Sportswear Manufacturing - Cenovia International</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="css/custom.css" rel="stylesheet">
  <link href="css/ui-theme.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="js/ui-kit.js"></script>
  <script src="components/TopRibbon.js"></script>
  <script src="components/MainNav.js"></script>
  <script src="components/SiteFooter.js"></script>
</head>

<body class="flex flex-col min-h-screen">
  <top-ribbon></top-ribbon>
  <main-nav></main-nav>

  <main class="flex-grow">
      <div class="ui-hero py-16">
          <div class="container mx-auto px-4 relative z-10">
              <p class="ui-eyebrow mb-4"><i data-lucide="sparkles"></i> Women's catalog</p>
              <h1 class="text-4xl md:text-5xl font-bold mb-4">Women's Sports Apparel</h1>
              <p class="text-lg text-white/80 max-w-2xl">Explore our collection of high-performance sportswear designed for women, including leggings, sports bras, tank tops, and more.</p>
          </div>
      </div>

      <div class="container mx-auto px-4 py-8">
          <div class="ui-filter-bar mb-8 space-y-4">
              <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div class="flex flex-col sm:flex-row sm:items-center gap-4 w-full lg:w-auto">
                  <div class="relative flex-grow md:flex-grow-0">
                      <input type="search" placeholder="Search products..."
                             class="ui-input w-full md:w-64 pl-10">
                      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-[hsl(var(--muted-foreground))]"></i>
                  </div>
                  <select class="ui-select w-full sm:w-auto" id="categoryFilter">
                      <option value="">All Categories</option>
                      <option value="Sports Bra">Sports Bra</option>
                      <option value="Sports Top">Sports Top</option>
                      <option value="Compression Shorts">Compression Shorts</option>
                      <option value="Yoga Pants">Yoga Pants</option>
                  </select>
                  <select class="ui-select w-full sm:w-auto" id="sizeFilter">
                      <option value="">All Sizes</option>
                  </select>
                  <select class="ui-select w-full sm:w-auto" id="compositionFilter">
                      <option value="">All Fabrics</option>
                  </select>
                  <select class="ui-select w-full sm:w-auto" id="grammageFilter">
                      <option value="">All Grammage</option>
                  </select>
              </div>
              <div class="flex flex-col sm:flex-row sm:items-center gap-4 w-full lg:w-auto">
                  <select class="ui-select w-full sm:w-auto" id="sortFilter">
                      <option value="">Sort By</option>
                      <option value="name-asc">Name: A to Z</option>
                      <option value="name-desc">Name: Z to A</option>
                      <option value="grammage-high">Grammage: High to Low</option>
                      <option value="grammage-low">Grammage: Low to High</option>
                  </select>
                  <button id="clearFilters" class="ui-btn-outline w-full sm:w-auto">
                      Clear Filters
                  </button>
              </div>
              </div>
              <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-[hsl(var(--muted-foreground))]">
                  <p id="filterSummary">Loading products...</p>
                  <p>Choose up to 3 products to compare.</p>
              </div>
              <div id="filterChips" class="filter-chips hidden"></div>
          </div>
          <div id="compareTray" class="hidden ui-card mb-8 p-4"></div>
          <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          </div>
      </div>
  </main>

  <site-footer></site-footer>

  <script src="js/buyer-utils.js"></script>
  <script src="js/product-loader.js"></script>
  <script src="js/global-search.js"></script>
  <script src="js/product-search.js"></script>
  <script src="js/buyer-bar.js"></script>
  <script>
      document.addEventListener('DOMContentLoaded', () => {
          new ProductSearch('women');
      });
  </script>
</body>
</html>
