<!DOCTYPE html>
<html lang="en">
<head>
  <header-tags></header-tags>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://cenoviainternational.com/saved-products.html">
  <meta name="description" content="Review saved sportswear products from Cenovia International.">
  <title>Saved Products - Cenovia International</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="css/custom.css" rel="stylesheet">
  <link href="css/ui-theme.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="js/ui-kit.js"></script>
  <script src="components/TopRibbon.js"></script>
  <script src="components/MainNav.js"></script>
  <script src="components/SiteFooter.js"></script>
</head>
<body class="flex flex-col min-h-screen">
  <top-ribbon></top-ribbon>
  <main-nav></main-nav>

  <main class="flex-grow">
      <div class="ui-hero py-16">
          <div class="container mx-auto px-4 relative z-10">
              <p class="ui-eyebrow mb-4"><i data-lucide="heart"></i> Buyer shortlist</p>
              <h1 class="text-4xl md:text-5xl font-bold mb-4">Saved Products</h1>
              <p class="text-lg text-white/80 max-w-2xl">Review shortlisted styles before sending an inquiry.</p>
          </div>
      </div>

      <div class="container mx-auto px-4 py-10">
          <div id="savedActionsBar" class="hidden saved-actions-bar ui-card mb-8">
              <div>
                  <p class="text-lg font-semibold" id="savedCount">0 products shortlisted</p>
                  <p class="text-sm text-[hsl(var(--muted-foreground))]">Send your shortlist to sales, share it with your team, or export specs.</p>
                  <p id="savedActionStatus" class="text-sm text-green-700 mt-2 hidden"></p>
              </div>
              <div class="saved-actions-bar__buttons">
                  <button type="button" id="sendInquiryBtn" class="ui-btn-primary">Send inquiry</button>
                  <button type="button" id="shareShortlistBtn" class="ui-btn-outline">Share link</button>
                  <button type="button" id="exportCsvBtn" class="ui-btn-outline">Export CSV</button>
              </div>
          </div>
          <div id="savedProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
      </div>
  </main>

  <site-footer></site-footer>
  <script src="js/buyer-utils.js"></script>
  <script src="js/product-loader.js"></script>
  <script src="js/global-search.js"></script>
  <script src="js/saved-products.js"></script>
  <script src="js/buyer-bar.js"></script>
</body>
</html>
